<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Einkaufsliste Rick – Bootsausflug 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #1a4a6e;
      --accent-light: #2e7da8;
      --accent-bg: #c8e6f5;
      --navy: #0d2137;
      --sand: #f5ead8;
      --cream: #fdfaf5;
      --gold: #c9a84c;
      --text: #1a2535;
      --muted: #6b7f92;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--cream); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; line-height: 1.7; }
    header { background: var(--navy); position: relative; padding: 50px 40px 70px; overflow: hidden; }
    header::before { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 55px; background: var(--cream); clip-path: ellipse(55% 100% at 50% 100%); }
    .header-inner { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
    .person-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-light); color: white; font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; padding: 5px 14px; border-radius: 2px; margin-bottom: 20px; }
    header h1 { font-family: 'Playfair Display', serif; font-size: clamp(32px, 5vw, 58px); color: white; line-height: 1.1; font-weight: 900; }
    header h1 span { color: var(--gold); }
    .header-sub { margin-top: 12px; color: var(--accent-bg); font-size: 14px; }
    .progress-bar { margin-top: 20px; background: rgba(255,255,255,0.1); border-radius: 999px; height: 6px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--gold); border-radius: 999px; transition: width 0.4s ease; }
    .progress-label { margin-top: 8px; color: rgba(255,255,255,0.5); font-size: 12px; }

    main { max-width: 900px; margin: 0 auto; padding: 0 24px 80px; }
    .section-label { display: flex; align-items: center; gap: 16px; margin: 50px 0 24px; }
    .section-label h2 { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--navy); }
    .section-label .line { flex: 1; height: 1px; background: linear-gradient(to right, var(--accent), transparent); opacity: 0.2; }

    .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .shop-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 14px rgba(13,33,55,0.07); animation: fadeUp 0.4s ease both; }
    .shop-card-header { padding: 13px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--sand); }
    .shop-emoji { font-size: 18px; }
    .shop-category { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; color: var(--navy); }
    .shop-items { list-style: none; padding: 12px 18px; display: flex; flex-direction: column; }
    .shop-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f5f5f5; font-size: 13.5px; color: var(--text); cursor: pointer; user-select: none; transition: color 0.15s; }
    .shop-item:last-child { border-bottom: none; }
    .shop-item.checked { color: #b0bec5; text-decoration: line-through; }
    .check-box { width: 18px; height: 18px; border: 1.5px solid #cdd5db; border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-size: 11px; }
    .shop-item.checked .check-box { background: var(--accent-light); border-color: var(--accent-light); color: white; }
    .shop-qty { color: var(--muted); font-size: 12px; margin-left: auto; flex-shrink: 0; }

    .reset-bar { display: flex; justify-content: flex-end; margin-top: 20px; gap: 12px; }
    .btn { background: none; border: 1.5px solid var(--muted); color: var(--muted); padding: 8px 18px; border-radius: 6px; font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }

    footer { background: var(--navy); padding: 24px 40px; text-align: center; }
    footer p { color: rgba(255,255,255,0.3); font-size: 12px; }
    footer span { color: var(--gold); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) { header { padding: 36px 20px 60px; } .shop-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="person-badge">⛵ Rick's Liste · Haltbare Waren</div>
    <h1>Einkauf<br/><span>Bootsausflug 2026</span></h1>
    <div class="header-sub">Alle nicht verderblichen Artikel – kann früh eingekauft werden</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel">0 von 0 Artikeln erledigt</div>
  </div>
</header>

<main>
  <div class="section-label"><h2>Einkaufsliste</h2><div class="line"></div></div>
  <p style="font-size:13px;color:var(--muted);margin-bottom:20px;">Artikel antippen zum Abhaken.</p>
  <div class="shop-grid" id="shopGrid"></div>
  <div class="reset-bar">
    <button class="btn" onclick="resetAll()">↺ Zurücksetzen</button>
  </div>
</main>

<footer><p>⛵ Gute Fahrt &amp; <span>faire Winde</span></p></footer>

<script>
const categories = [
  { emoji:'🥣', name:'Frühstück (haltbar)', items:[
    { name:'Haferflocken', qty:'500 g' },
    { name:'Oatley Hafermilch', qty:'2 Packungen' },
    { name:'Kaffeepulver gemahlen', qty:'1 Packung' },
    { name:'Marmelade', qty:'1 Glas' },
    { name:'Nutella', qty:'1 Glas' },
  ]},
  { emoji:'🌯', name:'Wraps & Zutaten', items:[
    { name:'Wraps groß', qty:'20 Stück' },
    { name:'Schwarze Bohnen (Dose)', qty:'2 Dosen' },
    { name:'Mais (Dose)', qty:'1 Dose' },
    { name:'Salsa', qty:'1 Glas' },
    { name:'Sriracha / Tabasco', qty:'1 Flasche' },
  ]},
  { emoji:'🍝', name:'Abendessen – Pasta', items:[
    { name:'Pasta (Penne / Rigatoni)', qty:'600 g' },
    { name:'Thunfisch (Dose)', qty:'4 Dosen' },
    { name:'Erbsen (Dose)', qty:'1 Dose' },
  ]},
  { emoji:'🍛', name:'Abendessen – Dal', items:[
    { name:'Rote Linsen', qty:'400 g' },
    { name:'Kokosmilch (Dose)', qty:'2 Dosen' },
    { name:'Tomaten (Dose)', qty:'1 Dose' },
    { name:'Garam Masala', qty:'1 Packung' },
    { name:'Kreuzkümmel', qty:'1 Packung' },
    { name:'Kurkuma', qty:'1 Packung' },
  ]},
  { emoji:'🍔', name:'Abendessen – Burger', items:[
    { name:'Burger Buns', qty:'12 Stück' },
    { name:'Aluschalen (Grill)', qty:'1 Packung' },
  ]},
  { emoji:'🥗', name:'Gemüse (haltbar)', items:[
    { name:'Kartoffeln', qty:'1,5 kg' },
    { name:'Normale Zwiebeln', qty:'6 Stück' },
    { name:'Rote Zwiebeln', qty:'4 Stück' },
    { name:'Knoblauch', qty:'1 Knolle' },
  ]},
  { emoji:'🫙', name:'Saucen & Condiments', items:[
    { name:'Ketchup', qty:'1 Flasche' },
    { name:'Mayo', qty:'1 Tube' },
    { name:'Senf', qty:'1 Tube' },
    { name:'Gewürzgurken', qty:'1 Glas' },
    { name:'Oliven (Snack)', qty:'1 Glas' },
    { name:'Hummus', qty:'400 g' },
  ]},
  { emoji:'🍿', name:'Snacks', items:[
    { name:'Chips', qty:'3 Packungen' },
    { name:'Salzstangen', qty:'2 Packungen' },
    { name:'Nüsse / Cashews', qty:'300 g' },
    { name:'Studentenfutter', qty:'200 g' },
    { name:'Müsliriegel', qty:'8 Stück' },
    { name:'Knäckebrot', qty:'1 Packung' },
    { name:'Cracker', qty:'1 Packung' },
    { name:'Reiswaffeln', qty:'1 Packung' },
    { name:'Popcorn-Mais', qty:'1 Packung' },
    { name:'Haribo / Gummibärchen', qty:'2 Packungen' },
    { name:'Schokolade', qty:'3 Tafeln' },
    { name:'Kekse / Oreos', qty:'2 Packungen' },
  ]},
  { emoji:'🍺', name:'Getränke', items:[
    { name:'Wasser still 1,5 l PET', qty:'25 Flaschen' },
    { name:'Bier', qty:'nach Bedarf' },
    { name:'Wein', qty:'3 Flaschen' },
    { name:'Rum', qty:'1 Flasche' },
    { name:'Cola', qty:'8 Dosen' },
  ]},
  { emoji:'🧂', name:'Basics & Gewürze', items:[
    { name:'Olivenöl', qty:'1 Flasche' },
    { name:'Salz & Pfeffer', qty:'—' },
    { name:'Chili-Flocken', qty:'1 Packung' },
    { name:'Oregano getrocknet', qty:'1 Packung' },
    { name:'Gemüsebrühe Würfel', qty:'1 Packung' },
    { name:'Alufolie', qty:'1 Rolle' },
    { name:'Ziplock-Beutel', qty:'1 Packung' },
  ]},
  { emoji:'🧹', name:'Haushalt & Grill', items:[
    { name:'Servietten', qty:'2 Packungen' },
    { name:'Küchenpapier', qty:'2 Rollen' },
    { name:'Müllsäcke', qty:'1 Packung' },
    { name:'Spülmittel + Schwamm', qty:'—' },
    { name:'Grillzange (prüfen ob an Bord)', qty:'—' },
  ]},
];

const KEY = 'rick2026';
const saved = JSON.parse(localStorage.getItem(KEY) || '{}');

function countAll() {
  return categories.reduce((s, c) => s + c.items.length, 0);
}
function countChecked() {
  return Object.keys(saved).filter(k => saved[k]).length;
}
function updateProgress() {
  const total = countAll(), done = countChecked();
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = done + ' von ' + total + ' Artikeln erledigt';
}

function render() {
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';
  categories.forEach((cat, ci) => {
    const card = document.createElement('div');
    card.className = 'shop-card';
    card.style.animationDelay = (ci * 0.03) + 's';
    const items = cat.items.map((item, ii) => {
      const key = ci + '_' + ii;
      const checked = saved[key] ? 'checked' : '';
      return `<li class="shop-item ${checked}" onclick="toggle('${key}',this)">
        <span class="check-box">${checked ? '✓' : ''}</span>
        <span>${item.name}</span>
        <span class="shop-qty">${item.qty}</span>
      </li>`;
    }).join('');
    card.innerHTML = `
      <div class="shop-card-header">
        <span class="shop-emoji">${cat.emoji}</span>
        <span class="shop-category">${cat.name}</span>
      </div>
      <ul class="shop-items">${items}</ul>`;
    grid.appendChild(card);
  });
  updateProgress();
}

function toggle(key, el) {
  el.classList.toggle('checked');
  const box = el.querySelector('.check-box');
  if (el.classList.contains('checked')) { saved[key] = true; box.textContent = '✓'; }
  else { delete saved[key]; box.textContent = ''; }
  localStorage.setItem(KEY, JSON.stringify(saved));
  updateProgress();
}

function resetAll() {
  if (!confirm('Alle Häkchen zurücksetzen?')) return;
  Object.keys(saved).forEach(k => delete saved[k]);
  localStorage.setItem(KEY, JSON.stringify(saved));
  render();
}

render();
</script>
</body>
</html>
